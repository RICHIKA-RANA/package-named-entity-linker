[project]
name = "package-named-entity-linker"
version = "3.1.0"
description = "Links detected named entities in text to their corresponding canonical entities in a knowledge base for accurate identification and disambiguation."
authors = [
    { name = "immkg", email = "mayank.g@smarter.codes" }
]
readme = "README.md"
requires-python = ">=3.12,<3.14"

[tool.poetry]
packages = [
    { include = "talkingdb_nel" }
]

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
fastapi = ">=0.125.0,<0.126.0"
uvicorn = { version = ">=0.38.0,<0.39.0", extras = ["standard"] }
requests = ">=2.32.5,<3.0.0"
pydantic = ">=2.12.5,<3.0.0"
debugpy = ">=1.8.19,<2.0.0"
redis = "^7.4.0"
networkx = "^3.6.1"

talkingdb-models = { git = "git+https://github.com/TalkingDB/base-tdb-models.git", rev = "17a8956d58189cd8c8bf7994801ef6e87b93bbe5" }
talkingdb-clients = { git = "git+https://github.com/TalkingDB/base-tdb-clients.git", rev = "9931c1f832d4772f5137cdc4bb193daadab2ad30" }
talkingdb-helpers = { git = "git+https://github.com/TalkingDB/base-tdb-helpers.git", rev = "faf3303fe48a448f2bbb0d364b3cdcc1c54029bc" }

[tool.poetry.group.dev.dependencies]
pytest = "^8.4"
pytest-cov = "^7.0"
pytest-mock = "^3.15"
httpx = "^0.28.1"
ruff = "^0.16.1"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
]

[tool.coverage.run]
source = ["talkingdb_nel"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
